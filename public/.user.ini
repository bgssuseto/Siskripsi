; Menaikkan batas upload PHP-level agar file persyaratan berukuran hingga 4MB
; (batas yang dijanjikan aplikasi ke mahasiswa) benar-benar bisa diunggah.
; Tanpa ini, host yang default upload_max_filesize-nya di bawah 4MB (banyak
; shared hosting default ke 2MB) akan menolak file di server SEBELUM validasi
; Laravel sempat jalan — mahasiswa melihat file-nya "gagal" tanpa alasan jelas
; walau ukurannya sudah sesuai ketentuan yang ditampilkan di halaman pendaftaran.
upload_max_filesize = 8M
post_max_size = 10M
